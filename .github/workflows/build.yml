name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [ReleaseIII, ReleaseVC]

    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
      DXSDK_DIR: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout plugin-sdk (includes rwsdk)
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: 315c62e299cfda326e7ed7a75704010672b14748
          path: plugin-sdk

      - name: Prepare plugin-sdk compatibility headers
        shell: pwsh
        run: |
          # Pin to plugin-sdk commit compatible with this codebase; add missing VC RpAnimBlend.h if absent.
          $vcHeader = Join-Path $env:PLUGIN_SDK_DIR "plugin_vc\game_vc\RpAnimBlend.h"
          if (-not (Test-Path $vcHeader)) {
            $headerLines = @(
              '#pragma once'
              ''
              '#include "RenderWare.h"'
              '#include "CAnimBlendAssociation.h"'
              ''
              'CAnimBlendAssociation* RpAnimBlendClumpGetAssociation(RpClump* clump, unsigned int animId);'
            )
            Set-Content -Path $vcHeader -Value $headerLines
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin-sdk static libraries
        shell: cmd
        run: |
          pushd plugin-sdk\tools\premake
          premake5.exe --pluginsdkdir="%GITHUB_WORKSPACE%\plugin-sdk" vs2022
          popd
          msbuild plugin-sdk\plugin.sln /m /p:Configuration=Release

      - name: Generate VS2022 solution with Premake
        shell: cmd
        run: premake5.bat

      - name: Build ${{ matrix.configuration }}
        shell: cmd
        run: >
          if not exist scripts mkdir scripts &&
          msbuild project_files\classic-axis.sln
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=Win32
          /p:GTA_III_DIR=${{ github.workspace }}
          /p:GTA_VC_DIR=${{ github.workspace }}

      - name: Upload ASI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classic-axis-${{ matrix.configuration }}
          path: output/asi/*.asi
          if-no-files-found: error
